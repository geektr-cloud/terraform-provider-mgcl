name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenTofu ${{ matrix.tofu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tofu:
          - "1.11.11"
          - "1.13.9"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: go test -race -short ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Verify modules
        run: go mod verify
